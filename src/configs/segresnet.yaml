experiment_name: segresnet_2d_multiclass
model:
  name: segresnet_2d
  spatial_dims: 2
  in_channels: 1
  out_channels: 4
training:
  epochs: 100
  batch_size: 32
  eval_batch_size: 32
  num_workers: 4
  learning_rate: 0.0002
  weight_decay: 0.00001
  loss: dice_ce
  amp: true
evaluation:
  metrics: [dice, iou]
