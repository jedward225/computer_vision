experiment_name: diffusion_binary_100case
model:
  name: conditional_diffusion_unet
  image_channels: 1
  mask_channels: 2
  out_channels: 2
  base_channels: 48
  channel_mult: [1, 2, 4]
diffusion:
  train_steps: 200
  beta_schedule: cosine
  prediction_type: epsilon
  sampler: ddim
  sample_steps: [5, 10, 25]
training:
  epochs: 50
  batch_size: 48
  eval_batch_size: 48
  num_workers: 4
  learning_rate: 0.0002
  weight_decay: 0.00001
  loss:
    noise_mse_weight: 1.0
    dice_ce_weight: 0.2
  amp: true
evaluation:
  metrics: [dice, iou]
  uncertainty_samples: 4
  validation_sample_steps: 10

